name: liquid_gallery
description: "Liquid Gallery: component catalog, theme switcher and a sample app screen for the Liquid Flutter Design System."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  liquid_flutter_design_system:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
